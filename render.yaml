services:
  - type: web
    name: lvay-football-scraper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: SEASON_YEAR
        value: 2026
      # LHSAA rows are authoritative; the saved Sportsline preseason schedule
      # remains as a gap fill until every official weekly slot is published.
      - key: ENABLE_FOOTBALL
        value: "true"
      - key: ENABLE_FOOTBALL_OOS_VERIFIER
        value: "true"
      - key: FOOTBALL_OOS_SHEET_ID
        value: 1IWrrYD8YIjV_uXuZUSxIHJQxoooBrmGZqFjD3J6BgbE
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PIPELINE_TOKEN
        sync: false
      - key: REPORT_EMAIL_TO
        value: markmiller36@gmail.com,jerit.roser@gmail.com
      - key: REPORT_EMAIL_FROM
        value: LVAY Pipeline <reports@updates.louisianavsallyall.com>
      - key: REPORT_EMAIL_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
    disk:
      name: lvay-data
      mountPath: /data
      sizeGB: 1

  - type: cron
    name: lvay-pipeline-scheduler
    env: python
    # Wake every 30 minutes; trigger_pipeline.py applies the Central-time
    # regular cadence and in-season Thursday/Friday football boost.
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python trigger_pipeline.py
    envVars:
      - key: PIPELINE_URL
        value: https://lvay-scraper.onrender.com/api/pipeline/run
      - key: PIPELINE_TOKEN
        sync: false
      - key: SCHEDULE_GATED
        value: "true"
