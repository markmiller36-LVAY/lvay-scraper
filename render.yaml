services:
  - type: web
    name: lvay-football-scraper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SEASON_YEAR
        value: 2026
      # Keep the LHSAA football scraper/rating pipeline paused while the
      # official 2026 schedules are incomplete.  The preseason import remains
      # available through the season-aware schedule API.
      - key: ENABLE_FOOTBALL
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PIPELINE_TOKEN
        sync: false
    disk:
      name: lvay-data
      mountPath: /data
      sizeGB: 1

  - type: cron
    name: lvay-pipeline-scheduler
    env: python
    schedule: "0 */4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python trigger_pipeline.py
    envVars:
      - key: PIPELINE_URL
        value: https://lvay-scraper.onrender.com/api/pipeline/run
      - key: PIPELINE_TOKEN
        sync: false
