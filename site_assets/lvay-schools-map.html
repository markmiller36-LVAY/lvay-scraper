<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Teko:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap">
<style>
/* Layout: full-screen 3D scene (Louisiana as a white extruded game board on a gridded floor); thin filter bar on top, Regions rail on the right, Schools card bottom left, camera controls bottom right. Single light look in LVAY colors. */
:root{
  --ground:#ececec; --ground2:#f6f6f6; --card:#ffffff; --ink:#000000; --muted:#5c5c5c; --rule:#d9d9d9;
  --teal:#008584; --teal-dark:#006b6a; --tint:#e0f0f0;
  --sans:"Nunito Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --slab:"Alfa Slab One",Rockwell,Georgia,serif;
  --teko:"Teko","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 100% at 50% 35%,#fbfbfb,var(--ground) 60%,#e2e2e2);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;overscroll-behavior:none}
.app{position:fixed;inset:0}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.14);min-width:0}
.panel{position:absolute;z-index:2}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--ground2);border:1px solid var(--rule);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

/* top filter bar */
.find{top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;align-items:center;gap:14px;padding:8px 14px;min-height:50px;flex-wrap:wrap}
.find h1{font-weight:900;font-size:18px;margin:0 6px 0 0;line-height:1;white-space:nowrap}
.find.card{background:var(--teal)}
.find h1{color:#000}
.find h1 span{color:#fff}
.find .count{color:#fff}.find .count b{color:#fff}
.find .linkbtn{color:#fff}
.find select{background:#fff;border-color:#fff}
.fld{display:flex;align-items:center;gap:7px;min-width:0}
.fld label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.fld select{width:auto;min-width:96px;padding:5px 8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stat{display:flex;align-items:center;gap:8px;min-width:0}
.stat select{width:auto;min-width:118px;padding:5px 8px;background:#fff;border-color:#fff}
.stat input[type=range]{width:170px;accent-color:#000;padding:0;background:none;border:0;cursor:pointer}
.stat input[type=range]:disabled{opacity:.45;cursor:default}
.sv{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:118px}
.wp.lead{background:#008584;color:#fff;border:.75px solid #000;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:800;gap:0}
.wp.lead small{color:#e0f0f0;font-size:10px;margin-left:5px}
@media (max-width:820px){.stat{flex:1 1 100%}.stat input[type=range]{flex:1}.sv{min-width:0}}
.summary{top:calc(env(safe-area-inset-top,0px) + var(--barH,62px) + 14px);left:16px;width:292px;max-height:calc(100% - var(--barH,62px) - 44px);overflow-y:auto;overscroll-behavior:contain;padding:0}
.sm-band{height:8px;display:flex}.sm-band i{flex:1}
.sm-head{display:flex;gap:10px;align-items:center;padding:12px 14px 8px}
.sm-logo{width:52px;height:52px;flex:none;border-radius:50%;background-color:#fff;border:3px solid;background-repeat:no-repeat}
.sm-head h2{font-size:18px;font-weight:900;line-height:1.1;margin:0;text-wrap:balance}
.sm-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.sm-col{all:unset;margin-left:auto;align-self:flex-start;flex:none;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--teal);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sm-col:focus-visible{outline:2px solid #000;outline-offset:2px}
.sm-col:hover{background:var(--teal-dark)}
.sm-col i{width:9px;height:9px;border-right:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-135deg) translate(-2px,-2px);transition:transform .2s}
.summary.collapsed .sm-col i{transform:rotate(45deg) translate(-2px,-2px)}
.summary.collapsed .sm-body{display:none}
.summary.collapsed .sm-head{padding-bottom:12px}
.sm-x{all:unset;margin-left:2px;align-self:flex-start;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
.sm-kick{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.sm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px 14px 10px}
.sm-grid div{background:var(--ground2);border:1px solid var(--rule);border-radius:7px;padding:5px 7px;min-width:0}
.sm-grid span{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sm-grid b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.sm-rows{list-style:none;margin:0;padding:0 14px 10px;font-size:12.5px}
.sm-rows li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--rule)}
.sm-rows li span{color:var(--muted)}
.sm-rows li b{text-align:right;font-weight:800}
.sm-h3{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 14px 4px}
.sm-tbl{width:calc(100% - 28px);margin:0 14px 12px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.sm-tbl th{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:3px 4px;border-bottom:1px solid var(--rule)}
.sm-tbl th:first-child,.sm-tbl td:first-child{text-align:left}
.sm-tbl td{padding:4px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.sm-tbl td:first-child{white-space:normal}
.sm-tbl th{white-space:nowrap}
.sm-tbl tr[data-id]{cursor:pointer}.sm-tbl tr[data-id]:hover td{background:var(--ground2)}
.sm-sch td{padding:4px 3px}
.sm-sch .wk{color:var(--muted);width:20px}
.sm-sch .op{white-space:normal;text-align:left}
.sm-sch .op small{color:var(--muted);margin-right:3px}
.sm-sch .op .d{display:inline-block;font-size:8.5px;font-weight:800;color:#fff;background:#000;border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px}
.sm-sch .op a{color:inherit;text-decoration:none;border-bottom:1px dotted #9a9a9a;cursor:pointer}
.sm-sch .res b{font-weight:900}.sm-sch .res .W{color:#008584}.sm-sch .res .L{color:#b3261e}.sm-sch .res .T{color:#5c5c5c}
.sm-sch tr.next td{background:var(--tint)}
.sm-go{display:block;margin:0 14px 14px;text-align:center;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:9px;border-radius:7px}
.sm-go:hover{background:var(--teal-dark)}
@media (max-width:820px){.summary{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);left:12px;right:76px;width:auto;max-height:42vh}}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--ink)}
.linkbtn{font:inherit;font-size:13px;font-weight:800;color:var(--teal);background:none;border:0;padding:2px 0;cursor:pointer}

/* regions rail */
.regions{top:calc(env(safe-area-inset-top,0px) + var(--barH,62px) + 14px);max-height:calc(100% - 180px);right:16px;width:58px;padding:5px 3px;border-radius:8px;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.regions.closed{bottom:auto}
.rtoggle{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:center;gap:3px;font-size:6.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:none;border-bottom:1px solid var(--rule);padding:3px 0 7px;cursor:pointer;flex:none}
.rtoggle:focus-visible{outline:2px solid #000;outline-offset:1px}
.rtoggle i{width:4px;height:4px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-135deg) translate(-1px,-1px);transition:transform .2s}
.regions.closed .rtoggle i{transform:rotate(45deg) translate(-1px,-1px)}
.regions .grid{margin-top:2px;display:flex;flex-direction:column;gap:0}
.reg{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 1px 3px;border-radius:6px;cursor:pointer;text-align:center;min-width:0}
.reg:hover{background:var(--ground2)}.reg.on{background:var(--tint)}
.reg:focus-visible{outline:2px solid var(--teal)}
.reg svg{width:24px;height:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.16))}
.reg span{font-size:8px;font-weight:800;line-height:1.1}
.reg small{font-size:7px;line-height:1.1;color:var(--muted);font-variant-numeric:tabular-nums}

/* schools card */
.schools{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:16px;width:330px;overflow:hidden}
.stoggle{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;font-weight:900;font-size:16px}
.stoggle:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.stoggle small{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;margin-left:6px}
.chev{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-135deg) translate(-2px,-2px);transition:transform .2s}
.schools.closed .chev{transform:rotate(45deg) translate(-2px,-2px)}
.sbody{border-top:1px solid var(--rule)}
.ssearch{padding:10px 16px}
.list{max-height:min(42vh,340px);overflow-y:auto;list-style:none;margin:0;padding:0;border-top:1px solid var(--rule);overscroll-behavior:contain}
.list button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--rule);cursor:pointer}
.list button:hover,.list button.on{background:var(--ground2)}
.list button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.sw{width:13px;height:13px;border-radius:50%;border:3px solid;flex:none}
.nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tag{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:12px 16px;color:var(--muted);font-size:13px}

/* camera pad */
.pad{position:absolute;z-index:2;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;grid-template-columns:repeat(3,38px);gap:5px;padding:7px}
.pad button{width:38px;height:38px;font:800 17px/1 var(--sans);background:var(--ground2);color:var(--teal);border:1px solid var(--rule);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.pad button:hover{background:var(--tint)}
.pad button:active{transform:translateY(1px)}
.pad .home{background:var(--teal);color:#fff;border-color:var(--teal)}
.pad svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* selected school bar */
.selcard{position:absolute;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;max-width:min(460px,calc(100% - 32px))}
.selcard .sw{width:16px;height:16px}
.selcard .t{min-width:0}
.selcard b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selcard span{font-size:12.5px;color:var(--muted)}
.selcard a{flex:none;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:8px 11px;border-radius:7px;white-space:nowrap}
.selcard a:hover{background:var(--teal-dark)}
.selcard .x{all:unset;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}

/* floating 3D labels */
.wp{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;background:#fff;border-radius:9px;padding:6px 12px 6px 8px;box-shadow:0 6px 16px rgba(0,0,0,.16);white-space:nowrap;transform:translate(-50%,-100%);will-change:transform}
.wp svg{width:16px;height:20px;flex:none}
.wp b{font-weight:900;font-size:14px;line-height:1.1;display:block}
.wp small{font-size:11.5px;color:var(--muted);font-weight:700}
.wp.city{gap:4px;padding:3px 7px 3px 5px;border-radius:6px;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.wp.city svg{width:10px;height:13px}
.wp.city{border:.75px solid #000}
.wp.city span{display:flex;flex-direction:column;line-height:1}
.wp.city b{font-size:11px;line-height:1}
.wp.city small{font-size:9.5px;line-height:1;margin-top:1px}
.wp.tag{gap:0;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.16)}
.wp.tag.on{background:#008584;color:#fff}
.wp.city.dim{opacity:.45}
.wp.sel{background:var(--teal);color:#fff;pointer-events:none}
.wp.sel small{color:#d9f0f0}
.tip{position:absolute;z-index:3;pointer-events:none;background:#000;color:#fff;border-radius:7px;padding:5px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-150%)}
.tip b{font-weight:900}
.help{position:absolute;z-index:2;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(255,255,255,.8);padding:4px 12px;border-radius:20px;white-space:nowrap;transition:opacity .6s}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}

@media (max-width:820px){
  .find{left:12px;right:12px;gap:8px 10px;padding:8px 10px}
  .find h1{display:none}
  .fld{flex:1 1 0}.fld label{display:none}.fld select{min-width:0;width:100%}
  .count{margin-left:0}
  .regions{top:calc(env(safe-area-inset-top,0px) + 110px);right:8px;width:52px;padding:4px 2px}
  .reg svg{width:22px;height:20px}
  .schools{left:12px;right:auto;width:calc(100% - 96px - 150px);min-width:150px}
  .pad{right:12px;grid-template-columns:repeat(3,34px);gap:4px;padding:5px}
  .pad button{width:34px;height:34px}
  .selcard{left:12px;right:88px;transform:none;max-width:none;bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
  .help{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* LVAY type: Alfa Slab One for the title, Teko for the map UI; the summary box keeps Nunito Sans */
.find h1{font-family:var(--slab);font-weight:400;font-size:21px;letter-spacing:.01em}
.find select,.stat select,.find .count,.find .linkbtn,.sv{font-family:var(--teko);font-size:18px;font-weight:500;letter-spacing:.02em;line-height:1}
.find select,.stat select{padding:4px 8px 2px}
.find .count b{font-weight:700}
.sv{font-weight:600;font-size:19px}
.find .linkbtn{text-transform:uppercase;letter-spacing:.06em;font-size:17px;font-weight:600}
.regions,.regions .rtoggle{font-family:var(--teko)}
.rtoggle{font-size:10px;letter-spacing:.12em;font-weight:600}
.reg span{font-size:11px;font-weight:600;line-height:1;letter-spacing:.02em}
.reg small{font-size:9.5px;line-height:1}
.schools,.schools input{font-family:var(--teko)}
.stoggle{font-size:22px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.stoggle small{font-size:18px;font-weight:500}
.ssearch input{font-size:18px;padding:5px 9px 3px}
.nm{font-size:18px;font-weight:600;letter-spacing:.01em;line-height:1}
.nm small{font-size:15px;font-weight:400;line-height:1}
.tag{font-size:16px}
.pad button{font-family:var(--teko);font-size:24px;font-weight:600}
.wp,.tip,.help{font-family:var(--teko)}
.wp b{font-size:17px;font-weight:600;letter-spacing:.02em}
.wp.city b{font-size:14px;line-height:.9}
.wp.city small{font-size:12px;line-height:.9;font-weight:500}
.wp.tag{font-size:14px;font-weight:600;letter-spacing:.02em;line-height:1;padding:3px 7px 1px}
.wp.lead{font-size:15px;font-weight:600;line-height:1;padding:3px 7px 1px}
.wp.lead small{font-size:13px}
.wp small{font-size:14px}
.tip{font-size:16px;letter-spacing:.02em}
.help{font-size:15px;letter-spacing:.03em}
.summary,.summary *{font-family:var(--sans)}
/* site cookie-settings button (CookieYes) hidden on the map page only */
.cky-btn-revisit-wrapper{display:none!important}
.ftog{display:none}
@media (max-width:820px){
  .find{gap:8px;padding:8px 10px;row-gap:8px}
  .find h1{display:block;font-size:16px;order:0}
  .ftog{display:flex;align-items:center;gap:6px;order:1;margin-left:auto;font:600 17px/1 var(--teko);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.18);border:0;border-radius:6px;padding:7px 10px 5px;cursor:pointer}
  .ftog i{width:6px;height:6px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg) translate(-1px,-1px);transition:transform .2s}
  .find.open .ftog i{transform:rotate(-135deg) translate(-1px,-1px)}
  .find .hsearch{order:2;flex:1 1 100%}
  .find > .fld:not(.hsearch),.find .count,.find .linkbtn{display:none;order:3}
  /* phones: stat picker + slider live in their own bar at the bottom of the screen */
  .find .stat{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:nowrap;gap:10px;align-items:center;background:var(--teal);border-radius:10px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:3}
  .find .stat select{flex:0 0 auto;min-width:0;width:auto}
  .find .stat input[type=range]{flex:1 1 auto;width:auto;min-width:0}
  .find .stat .sv{flex:0 0 auto;min-width:0;font-size:16px}
  .pad{display:none}
  .summary{bottom:calc(env(safe-area-inset-bottom,0px) + 72px)!important;right:12px!important}
  .find.open > .fld:not(.hsearch){display:flex;flex:1 1 calc(50% - 4px)}
  .find.open .count{display:block;margin-left:0}
  .find.open .linkbtn{display:block;margin-left:auto}
  .sugg{width:100%}
  .regions{right:8px;width:52px;top:calc(env(safe-area-inset-top,0px) + var(--barH,62px) + 10px)}
}
.hsearch input{width:230px;font-family:var(--teko);font-size:18px;font-weight:500;padding:5px 10px 3px;background:#fff;border-color:#fff;color:#000}
.hsearch input::placeholder{color:#7a7a7a}
.hsearch{position:relative}
.sugg{position:absolute;top:calc(100% + 6px);left:0;width:300px;max-height:340px;overflow-y:auto;list-style:none;margin:0;padding:4px 0;background:#fff;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.22);z-index:5}
.sugg li{display:flex;align-items:center;gap:9px;padding:6px 12px;cursor:pointer;font-family:var(--teko);line-height:1}
.sugg li:hover,.sugg li.on{background:var(--tint)}
.sugg .sw{width:14px;height:14px}
.sugg b{font-size:18px;font-weight:600;color:#000;display:block}
.sugg small{font-size:14px;color:var(--muted)}
.sugg .rec{margin-left:auto;font-size:16px;color:var(--muted)}
.sugg .none{color:var(--muted);font-size:16px;cursor:default}
@media (max-width:820px){.hsearch{flex:1 1 100%}.hsearch input{width:100%}}
</style>

<div class="app">
  <div id="stage" aria-label="3D map of Louisiana with every LHSAA football school"></div>
  <div id="labels"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="help" id="help">Drag to move · right-drag or two fingers to spin and tilt · scroll to zoom</div>

  <section class="card panel find" aria-label="Filters">

const $=id=>document.getElementById(id);
const pk=s=>String(s||"").toLowerCase().replace(/saint/g,"st").replace(/[^a-z]/g,"");
const slug=n=>n.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CLASS_ORDER=["5A","4A","3A","2A","1A"];

const PARISH_FIX={"Acadiana Christian":"Lafayette","Acadiana Renaissance Charter":"Lafayette","Doyle":"Livingston","Ecole Classique":"Jefferson","JS Clark Leadership Academy":"St. Landry","Morris Jeff":"Orleans"};
SCHOOLS.forEach((s,i)=>{s.id=i;s.key=s.cl+"|"+s.d;if(!s.pa)s.pa=PARISH_FIX[s.n]||"";s.pk=pk(s.pa);});
const REGIONS=[
  {n:"North",p:["Caddo","Bossier","Webster","Claiborne","Union","Lincoln","Bienville","Jackson","Ouachita","Morehouse","Richland","West Carroll","East Carroll","Madison","Tensas","Franklin","Caldwell","De Soto","Red River"]},
  {n:"Central",p:["Natchitoches","Sabine","Winn","Grant","La Salle","Catahoula","Concordia","Rapides","Vernon","Avoyelles"]},
  {n:"Southwest",p:["Beauregard","Allen","Calcasieu","Jefferson Davis","Cameron"]},

  {n:"Capital",p:["Pointe Coupee","West Feliciana","East Feliciana","West Baton Rouge","East Baton Rouge","Livingston","Iberville","Ascension","St. Helena"]},
  {n:"Northshore",p:["Tangipahoa","Washington","St. Tammany"]},
  {n:"Bayou",p:["Assumption","Terrebonne","Lafourche","St. James"]},
  {n:"New Orleans",p:["Orleans","Jefferson","St. Bernard","Plaquemines","St. Charles","St. John the Baptist"]}
];
const regionOf={};REGIONS.forEach(r=>{r.k=r.p.map(pk);r.k.forEach(k=>regionOf[k]=r.n);});
SCHOOLS.forEach(s=>s.rg=regionOf[s.pk]||"");
/* each parish's area code = the code its schools use (Tensas has no school: 318) */
const acOf={tensas:"318"};
d3.groups(SCHOOLS,s=>s.pk).forEach(([k,list])=>{acOf[k]=d3.greatest(d3.rollups(list,v=>v.length,s=>s.ac),d=>d[1])[0];});
function applyStats(){SCHOOLS.forEach((s,i)=>{const a=STATS[i];if(a){s.w=a[0];s.l=a[1];s.t=a[2];s.pf=a[3];s.pag=a[4];s.gp=a[5];}else{s.w=s.l=s.t=s.pf=s.pag=s.gp=undefined;}});}
applyStats();
let statKey="",statLevels=[],statIdx=0;
const statVal=s=>statKey==="w"?s.w:statKey==="pf"?s.pf:s.pag;
function passStat(s){if(!statKey||statIdx===0)return true;if(s.gp==null)return false;const th=statLevels[statIdx];return statKey==="pa"?s.pag<=th:statVal(s)>=th;}
function statText(s){return statKey==="w"?`${s.w}-${s.l}${s.t?"-"+s.t:""}`:statKey==="pf"?`${s.pf} pts`:`${s.pag} allowed`;}
const allPts=PARISHES.flatMap(p=>p.r.flat());

/* ---------- region mini maps (flat SVG icons) ---------- */
(function(){
  const mini=d3.geoMercator().fitExtent([[2,2],[56,50]],{type:"MultiPoint",coordinates:allPts});
  const md=PARISHES.map(p=>({k:pk(p.n),d:p.r.map(r=>"M"+r.map(c=>mini(c).map(v=>v.toFixed(1)).join(",")).join("L")+"Z").join("")}));
  $("regions").innerHTML=REGIONS.map(r=>{
    const n=SCHOOLS.filter(s=>s.rg===r.n).length,set=new Set(r.k);
    return `<button type="button" class="reg" data-r="${esc(r.n)}"><svg viewBox="0 0 58 54" aria-hidden="true"><g transform="translate(0,2)">${md.map(m=>`<path d="${m.d}" fill="#bdbdbd" stroke="#bdbdbd" stroke-width=".5"/>`).join("")}</g>${md.map(m=>`<path d="${m.d}" fill="${set.has(m.k)?"#008584":"#ffffff"}" stroke="${set.has(m.k)?"#008584":"#d9d9d9"}" stroke-width=".5"/>`).join("")}</svg><span>${esc(r.n)}</span><small>${n} schools</small></button>`;
  }).join("");
})();

/* ---------- world coordinates: Mercator 1000×1000 → 20×20 world units on the X/Z floor ---------- */
const merc=d3.geoMercator().fitSize([1000,1000],{type:"MultiPoint",coordinates:allPts});
const toW=ll=>{const [x,y]=merc(ll);return [(x-500)/50,(y-500)/50];};   /* returns [x, z]; north = −z */
const DEPTH=0.55;

const stage=$("stage");
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){renderer=null;}
if(!renderer){stage.innerHTML='<div class="nogl">This map needs WebGL, which is turned off or not supported in this browser.</div>';}
else{
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xececec,55,170);
const camera=new THREE.PerspectiveCamera(36,1,0.5,400);

/* light */
scene.add(new THREE.HemisphereLight(0xffffff,0xbdbdbd,0.78));
const sun=new THREE.DirectionalLight(0xffffff,0.72);
sun.position.set(-9,22,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:70});
sun.shadow.bias=-0.0006;sun.shadow.radius=4;
scene.add(sun);

/* floor: shadow catcher + game grid */
const floor=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.ShadowMaterial({opacity:.2}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(400,200,0xc9c9c9,0xd9d9d9);
grid.material.transparent=true;grid.material.opacity=.55;grid.position.y=-0.03;scene.add(grid);

/* Louisiana: one extruded tile per parish */
const sideMat=new THREE.MeshStandardMaterial({color:new THREE.Color(0x8c8c8c).convertSRGBToLinear(),roughness:.92,metalness:0});
const parishMeshes=[];
const seamPts=[];
PARISHES.forEach(p=>{
  const shapes=p.r.map(ring=>{
    const sh=new THREE.Shape();
    ring.forEach((c,i)=>{const [x,z]=toW(c);i?sh.lineTo(x,-z):sh.moveTo(x,-z);});
    return sh;
  });
  const geo=new THREE.ExtrudeGeometry(shapes,{depth:DEPTH,bevelEnabled:false,curveSegments:1});
  const cap=new THREE.MeshStandardMaterial({color:new THREE.Color(0xd9d9d9).convertSRGBToLinear(),roughness:.7,metalness:0});
  const m=new THREE.Mesh(geo,[cap,sideMat]);
  m.rotation.x=-Math.PI/2;m.castShadow=true;m.receiveShadow=true;
  geo.computeBoundingBox();const bb=geo.boundingBox;
  m.userData={k:pk(p.n),name:p.n,cap,cx:(bb.min.x+bb.max.x)/2,cz:-(bb.min.y+bb.max.y)/2,ext:Math.max(bb.max.x-bb.min.x,bb.max.y-bb.min.y)};
  scene.add(m);parishMeshes.push(m);
  p.r.forEach(ring=>{for(let i=0;i<ring.length-1;i++){const a=toW(ring[i]),b=toW(ring[i+1]);seamPts.push(a[0],DEPTH+.004,a[1],b[0],DEPTH+.004,b[1]);}});
});
const seamGeo=new THREE.BufferGeometry();seamGeo.setAttribute("position",new THREE.Float32BufferAttribute(seamPts,3));
scene.add(new THREE.LineSegments(seamGeo,new THREE.LineBasicMaterial({color:0x7d7d7d})));
/* parish names painted flat on each tile */
var LABELS=[];
const LABEL_FONT="600 72px Teko, 'Arial Narrow', Arial, sans-serif";
PARISHES.forEach(p=>{
  let big=p.r.reduce((a,b)=>b.length>a.length?b:a).map(toW),A=0,cx=0,cz=0;
  for(let i=0;i<big.length-1;i++){const [x0,z0]=big[i],[x1,z1]=big[i+1],f=x0*z1-x1*z0;A+=f;cx+=(x0+x1)*f;cz+=(z0+z1)*f;}
  A/=2;cx/=6*A;cz/=6*A;
  const xs=big.map(q=>q[0]),zs=big.map(q=>q[1]);
  const w=Math.min(Math.max(...xs)-Math.min(...xs),Math.max(...zs)-Math.min(...zs))*.9;
  flatLabel(p.n,cx,cz,Math.min(w,1.25)*.8,DEPTH+.006,"#d9d9d9");
});

/* LVAY logo lying flat on the floor east of the river parishes */
(function(){
  const [cx,cz]=toW([-89.72,32.05]);const w=toW([-89.0,32.05])[0]-toW([-90.44,32.05])[0];
  const tex=new THREE.TextureLoader().load(LOGO_URI);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(w,w*1024/1100),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4}));
  logo.rotation.x=-Math.PI/2;logo.position.set(cx,0.05,cz);logo.renderOrder=5;scene.add(logo);
})();

/* the rest of the U.S. painted flat on the floor under Louisiana */
function buildLabel(L){
  const label=L.text.toUpperCase(),cv=document.createElement("canvas"),ctx=cv.getContext("2d");
  ctx.font=LABEL_FONT;const tw=ctx.measureText(label).width;
  cv.width=Math.ceil(tw+20);cv.height=76;
  ctx.font=LABEL_FONT;ctx.fillStyle=L.color;ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText(label,cv.width/2,62);
  const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();

  /* school logos -> atlas */
  fetch("/wp-content/uploads/2026/09/bayou-power-board-logo-urls-2026.json").then(r=>r.json()).then(idx=>{
    const find=lookup(idx),ctx=atlasCv.getContext("2d");let left=0;
    const done=()=>{atlasTex.needsUpdate=true;try{ATLAS_URI=atlasCv.toDataURL("image/webp",.85);}catch(e){}if($("summary")&&!$("summary").hidden)render();};
    SCHOOLS.forEach(s=>{const k=find(s);const u=k&&idx[k]&&idx[k].logo;if(!u)return;left++;
      const img=new Image();img.crossOrigin="anonymous";
      img.onload=()=>{const T=56,f=Math.min((T-4)/img.width,(T-4)/img.height),w=img.width*f,h=img.height*f;ctx.drawImage(img,(s.id%18)*T+(T-w)/2,Math.floor(s.id/18)*T+(T-h)/2,w,h);if(--left===0)done();else if(left%40===0)atlasTex.needsUpdate=true;};
      img.onerror=()=>{if(--left===0)done();};img.src=u;});
  }).catch(()=>{});
  /* this season's records + schedules */
  const API="https://lvay-scraper.onrender.com";
  Promise.all([fetch(API+"/api/standings/football?class=ALL&districts=ALL").then(r=>r.json()),fetch(API+"/api/schedules/football").then(r=>r.json())]).then(([st,sc])=>{
    const rec={};(st.districts||[]).forEach(g=>g.teams.forEach(x=>{rec[x.team]=[x.overall_wins,x.overall_losses,x.overall_ties,x.pf,x.pa,x.overall_games];}));
    const gm={};(sc.schools||[]).forEach(x=>{gm[x.school]=(x.games||[]).map(g=>[g.week,g.game_date,g.opponent,g.home_away,g.result||g.win_loss||"",g.score||"",g.is_district?1:0]);});
    if(!Object.keys(rec).length)return;
    const fr=lookup(rec),fg=lookup(gm);
    STATS=SCHOOLS.map(s=>{const k=fr(s);return k?rec[k]:null;});
    SCHED=SCHOOLS.map(s=>{const k=fg(s);return k?gm[k]:null;});
    applyStats();const keep=statIdx;setupStat();if(keep&&keep<statLevels.length){statIdx=keep;$("sr").value=keep;}
    render();
  }).catch(()=>{});
})(); /* phones: Regions starts folded up */
}
</script>
