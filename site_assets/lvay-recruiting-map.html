<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Teko:wght@400;500;600;700&display=swap">
<style>
/* Full-screen 3D board of the United States (each state an extruded tile on a gridded floor), thin teal header on top. LVAY colors. */
:root{
  --ground:#ececec; --ink:#000000; --muted:#3d4444; --rule:#d9d9d9;
  --teal:#008584; --tint:#e0f0f0;
  --slab:"Alfa Slab One",Rockwell,Georgia,serif;
  --teko:"Teko","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(130% 100% at 50% 35%,#fbfbfb,var(--ground) 60%,#e2e2e2);color:var(--ink);font-family:var(--teko);overscroll-behavior:none}
.app{position:fixed;inset:0}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.bar{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;align-items:center;gap:14px;padding:8px 14px;min-height:50px;background:var(--teal);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.14)}
.bar h1{font-family:var(--slab);font-weight:400;font-size:20px;margin:0;line-height:1;white-space:nowrap;color:#000}
.bar h1 span{color:#fff}
.bar select{font-family:var(--teko);font-size:19px;font-weight:500;color:#000;background:#fff;border:1px solid #fff;border-radius:7px;padding:4px 8px 1px;min-width:150px;cursor:pointer}
.bar select:focus-visible{outline:2px solid #000;outline-offset:1px}
.bar #reset{margin-left:auto}
.bar button{font-family:var(--teko);font-size:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:none;border:0;cursor:pointer;padding:2px 2px 0}
.bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.help{position:absolute;z-index:2;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);font-size:15px;letter-spacing:.03em;color:var(--muted);background:rgba(255,255,255,.8);padding:4px 12px 2px;border-radius:999px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:22px;color:var(--muted)}
.regions{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 78px);max-height:calc(100% - 110px);right:16px;width:58px;padding:5px 3px;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.14);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.rtoggle{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:center;gap:3px;font-family:var(--teko);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--rule);padding:3px 0 7px;cursor:pointer;flex:none}
.rtoggle:focus-visible{outline:2px solid #000;outline-offset:1px}
.rtoggle i{width:4px;height:4px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-135deg) translate(-1px,-1px);transition:transform .2s}
.regions.closed .rtoggle i{transform:rotate(45deg) translate(-1px,-1px)}
.regions .grid{margin-top:2px;display:flex;flex-direction:column}
.regions .grid[hidden]{display:none}
.reg{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:3px 1px 3px;border-radius:6px;cursor:pointer;text-align:center;min-width:0;font-family:var(--teko)}
.reg:hover{background:#f6f6f6}.reg.on{background:var(--tint)}
.reg:focus-visible{outline:2px solid var(--teal)}
.reg svg{width:32px;height:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.16))}
.reg span{font-size:11px;font-weight:600;line-height:1;letter-spacing:.02em;margin-top:2px}
.reg small{font-size:9.5px;line-height:1;color:var(--muted)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.cl{position:absolute;left:0;top:0;font-family:var(--teko);font-size:15px;font-weight:500;line-height:1;color:#000;background:rgba(255,255,255,.88);padding:3px 6px 1px;border-radius:4px;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cl.on{background:#000;color:#fff}
.panel2{position:absolute;z-index:2;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:8px;max-width:min(320px,calc(100% - 32px))}
.legend,.card{background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.14)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px 12px 6px;font-size:16px;font-weight:500;line-height:1}
.legend button{all:unset;display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 0;opacity:1}
.legend button[aria-pressed="false"]{opacity:.35}
.legend button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.legend i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px #cfcfcf}
.legend .ttl{flex-basis:100%;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{padding:12px 14px 10px;display:grid;gap:4px}
.card h2{font-family:var(--slab);font-weight:400;font-size:19px;margin:0;line-height:1.1}
.card .nick{font-size:19px;font-weight:500;color:var(--teal);line-height:1}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:4px 0 0;font-size:17px;line-height:1.1}
.card dt{color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.card dd{margin:0}
.card .x{all:unset;justify-self:end;margin-top:-4px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;grid-row:1}
.card .x:focus-visible{outline:2px solid var(--teal)}
.panel2{max-width:min(400px,calc(100% - 32px))}
.card{max-height:calc(100vh - 220px);overflow-y:auto;overscroll-behavior:contain}
.card h3{font-family:var(--teko);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;border-top:1px solid var(--rule);padding-top:8px}
.card .recs{display:flex;gap:16px;margin-top:6px}
.card .recs div{display:grid;line-height:1}
.card .recs b{font-family:var(--slab);font-weight:400;font-size:24px}
.card .recs span{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card .asof{font-size:14px;color:var(--muted);line-height:1.1}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.card li{font-size:16px;line-height:1.1}
.card li a:not(.em):not(.xh),.card .hc a:not(.em):not(.xh){color:var(--teal);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.card li a:focus-visible,.card .hc a:focus-visible{outline:2px solid #000}
.card li small{display:block;color:var(--muted);font-size:14px}
.card .hc{font-size:20px;font-weight:600;line-height:1.1}
.card .hc small{display:block;font-size:14px;font-weight:400;color:var(--muted);line-height:1.15;margin-top:2px}
.card table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.1}
.card th,.card td{padding:2px 4px;text-align:center}
.card th:first-child,.card td:first-child{text-align:left}
.card thead th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule)}
.card tr.grp td{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:600;padding-top:6px}
.card td.z{color:#c4c4c4}
.card td.tot,.card th.tot{font-weight:600}
.card tfoot td{border-top:1px solid var(--rule);font-weight:600}
.card .fine{font-size:13px;color:var(--muted);line-height:1.15}
.film{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px 8px;background:#ff6a13;color:#fff;border-radius:9px;cursor:pointer;box-shadow:0 3px 0 #b84500;transition:transform .12s, box-shadow .12s}
.film:hover{transform:translateY(-1px);box-shadow:0 4px 0 #b84500;background:#ff7a2b}
.film:active{transform:translateY(2px);box-shadow:0 1px 0 #b84500}
.film:focus-visible{outline:2px solid #000;outline-offset:3px}
.film .ic{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.film .ic svg{width:15px;height:15px;margin-left:2px;fill:#ff6a13}
.film b{display:block;font-family:var(--slab);font-weight:400;font-size:17px;line-height:1;letter-spacing:.01em}
.film small{display:block;font-family:var(--teko);font-size:15px;color:#fff3e8;line-height:1.1;margin-top:3px}
.film .arr{font-family:var(--teko);font-size:22px;color:#fff}
.follow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;margin-top:8px;padding:9px 12px 7px;background:#000;color:#fff;border-radius:9px;cursor:pointer;box-shadow:0 3px 0 #008584;transition:transform .12s, box-shadow .12s}
.follow:hover{transform:translateY(-1px);box-shadow:0 4px 0 #008584}
.follow:active{transform:translateY(2px);box-shadow:0 1px 0 #008584}
.follow:focus-visible{outline:2px solid #008584;outline-offset:3px}
.follow .ic{width:34px;height:34px;border-radius:50%;background:#008584;display:grid;place-items:center;font-family:var(--slab);font-size:15px;color:#fff;line-height:1}
.follow b{display:block;font-family:var(--slab);font-weight:400;font-size:16px;line-height:1}
.follow small{display:block;font-family:var(--teko);font-size:15px;color:#bfe3e2;line-height:1.1;margin-top:3px}
.follow .arr{font-family:var(--teko);font-size:22px}
@media (prefers-reduced-motion:reduce){.follow{transition:none}}
.camp{display:grid;gap:3px;font-size:16px;line-height:1.15}
.camp b{font-size:18px;font-weight:600}
.camp .row{display:grid;grid-template-columns:52px 1fr;gap:8px}
.camp .row span:first-child{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.camp a{color:var(--teal);font-weight:600}
.film-note{font-size:14px;color:#c45000;font-weight:600;line-height:1.1;margin-top:4px}
.film-note[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.film{transition:none}}
.card .fine a{color:var(--teal);font-weight:600}
.card .site{color:var(--teal);font-weight:600;text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.card .site:hover{color:#006b6a}
.card .site:focus-visible{outline:2px solid #000;outline-offset:2px}
.tip{position:absolute;z-index:3;pointer-events:none;font-family:var(--teko);font-size:17px;font-weight:500;line-height:1;background:#000;color:#fff;padding:5px 8px 2px;border-radius:5px;white-space:nowrap}
@media (max-width:720px){
  .panel2{left:10px;right:10px;max-width:none;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .bar{flex-wrap:wrap;gap:8px 12px}
  .bar select{order:3;flex:1 1 40%;min-width:0;font-size:18px}
  .regions{right:8px;width:54px;top:calc(env(safe-area-inset-top,0px) + 112px)}
  .bar{left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);min-height:44px;padding:7px 12px}
  .bar h1{font-size:17px}
  .bar .sel{font-size:19px}
  .help{display:none}
}

/* readability pass: larger, darker small text */
.panel2{max-width:min(430px,calc(100% - 32px))}
.card h2{font-size:22px}
.card .nick{font-size:21px}
.card dl{font-size:19px;gap:4px 12px}
.card dt{font-size:14px;color:var(--ink);opacity:.7}
.card .x{font-size:15px}
.card h3{font-size:16px;color:var(--ink);opacity:.75}
.card .recs b{font-size:28px}
.card .recs span{font-size:14px}
.card .asof{font-size:16px}
.card .hc{font-size:22px}
.card .hc small{font-size:16px;line-height:1.2}
.card li{font-size:19px;line-height:1.15}
.card li small{font-size:16px;line-height:1.15}
.card ul{gap:6px}
.card table{font-size:17px}
.card thead th{font-size:13px;color:var(--ink);opacity:.7}
.card tr.grp td{font-size:13px}
.card td.z{color:#9a9a9a}
.card .fine{font-size:15px;line-height:1.25}
.camp{font-size:18px}
.camp+.camp{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule)}
.camp b{font-size:20px}
.camp .row{grid-template-columns:58px 1fr}
.camp .row span:first-child{font-size:13px;color:var(--ink);opacity:.7}
.film b{font-size:19px}.film small{font-size:16px}
.follow b{font-size:18px}.follow small{font-size:16px}
.film-note{font-size:16px}
.legend{font-size:18px;gap:6px 12px}
.legend .ttl{font-size:13px;color:var(--ink);opacity:.75}
.legend i{width:13px;height:13px}
.cl{font-size:17px;padding:4px 7px 2px}
.tip{font-size:19px}
.reg span{font-size:12.5px}
.reg small{font-size:11px;color:var(--ink);opacity:.7}
.rtoggle{font-size:11px}
.regions{width:64px}
.bar select{font-size:21px}
.help{font-size:16px}
.card a.xh{display:inline-block;vertical-align:2px;margin-left:4px;font-family:var(--teko);font-size:14px;font-weight:600;letter-spacing:.02em;line-height:1;color:#fff;background:#000;text-decoration:none;padding:3px 7px 1px;border-radius:999px}
.card a.xh:hover{background:#008584}
.card .hc a.xh{font-size:15px}
.card details.xl{margin-top:6px}
.card details.xl summary{cursor:pointer;font-size:17px;font-weight:600;color:var(--teal)}
.card.themed details.xl summary{color:var(--sl,var(--sc))}
.card details.xl summary:focus-visible{outline:2px solid #000}
.card details.xl ul{margin-top:6px}
.card .pos{font-size:13px;font-weight:600;letter-spacing:.06em;background:#ececec;border-radius:4px;padding:1px 5px 0;margin-left:4px;vertical-align:2px}
.card .recs.mk span{color:var(--sl,var(--sc,#c40000));font-weight:700;font-size:15px;opacity:1}
.card details.xl small b{color:var(--ink);font-weight:700}
.card details.xl .pos{font-size:15px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--sc,#000);border-radius:5px;padding:2px 7px 0;margin-left:6px;vertical-align:1px}
.card .rt{background:#000;color:#fff;border-radius:8px;padding:6px 8px 8px;margin-top:4px}
.card .rt table{color:#fff}
.card .rt thead th{color:#fff;opacity:.75;border-bottom-color:#444}
.card .rt tr.grp td,.card.themed .rt tr.grp td{color:#ff5a5a}
.card .rt td.z{color:#666}
.card .rt tfoot td{border-top-color:#555}
.card a.qlink{display:block;margin:2px 0 8px;padding:8px 10px 6px;border:2px solid var(--sc,#008584);border-radius:8px;font-size:18px;font-weight:600;color:var(--ink);text-decoration:none}
.card a.qlink:hover{background:#f6f6f6}
.card a.qlink:focus-visible{outline:2px solid #000}
.card a.em{display:block;font-size:15px;font-weight:600;color:var(--ink);opacity:.8;text-decoration:none;word-break:break-all;user-select:all;margin-top:1px}
.card a.em::before{content:"✉ ";opacity:.6}
.card a.em:hover{opacity:1;text-decoration:underline}
.card .hc a.em{font-size:15px}
/* school-colored card */
.card .hd{display:flex;align-items:center;gap:12px;margin:-12px -14px 4px;padding:14px 14px 12px;background:var(--sc2,#000);border-bottom:5px solid var(--sc,#008584);border-radius:10px 10px 0 0}
.card .hd img{width:64px;height:auto;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.card .hd h2{color:#fff}
.card .hd .nick{color:#fff;opacity:.9}
.card.themed .x{position:relative;z-index:1;color:#fff;opacity:.85;margin-bottom:-26px}
.card.themed{padding-top:12px}
.card.themed li a:not(.xh):not(.em),.card.themed .hc a:not(.xh):not(.em),.card.themed .camp a,.card.themed .fine a,.card.themed a.site{color:var(--sl,var(--sc))}
.card.themed tr.grp td{color:var(--sc)}
.card.themed h3{border-top-color:var(--sc);border-top-width:2px}
.card.themed .recs b{color:var(--sc2)}
.card.themed a.xh:hover{background:var(--sc)}
@media (max-width:720px){.panel2{max-width:none}.card{max-height:calc(100vh - 250px)}}
</style>

<div class="app">
  <div id="stage" aria-label="3D map of the United States"></div>
  <header class="bar">
    <h1>LVAY <span>Recruiting Map</span></h1>
    <label for="fst" class="vh">State</label>
    <select id="fst"><option value="">State</option></select>
    <label for="fdv" class="vh">Division</label>
    <select id="fdv"><option value="">Division</option><option value="FBS">FBS</option><option value="FCS">FCS</option><option value="D2">Division II</option><option value="D3">Division III</option><option value="NAIA">NAIA</option><option value="JUCO">Junior college</option></select>
    <button type="button" id="reset">Reset</button>
  </header>
  <section class="regions" aria-label="Regions">
    <button type="button" class="rtoggle" id="rtoggle" aria-expanded="true" aria-controls="regions">Regions<i aria-hidden="true"></i></button>
    <div class="grid" id="regions"></div>
  </section>
  <div id="labels"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="panel2">
    <article class="card" id="card" hidden aria-live="polite"></article>
    <div class="legend" id="legend" role="group" aria-label="College levels"></div>
  </div>
  <div class="help" id="help">Drag to move · hold scroll wheel (or right-drag) to spin and tilt · scroll to zoom · click a state or a school</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function cardHtml(s){const esc=v=>String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const lvName=LV.find(l=>l[0]===s.lv)[1];
  const hd=s.th?`<div class="hd"><img src="${esc(s.th.lg)}" alt="" onerror="this.remove()"><div><h2>${esc(s.n)}</h2><div class="nick">${esc(s.k)}</div></div></div>`:`<h2>${esc(s.n)}</h2><div class="nick">${esc(s.k)}</div>`;
  return `<button type="button" class="x" id="cx">Close</button>${hd}<dl>${s.f&&s.f!==s.n?`<dt>School</dt><dd>${esc(s.f)}</dd>`:""}<dt>Level</dt><dd>${lvName}</dd><dt>Conference</dt><dd>${esc(s.cf)}</dd><dt>City</dt><dd>${esc(s.c)}, Texas</dd>${s.nt?`<dt>Note</dt><dd>${esc(s.nt)}</dd>`:""}${s.u?`<dt>Website</dt><dd><a class="site" href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.u.replace(/^https?:\/\/(www\.)?/,""))}</a></dd>`:""}</dl>${s.d?`<button type="button" class="film" id="filmBtn"><span class="ic"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg></span><span><b>Send My Hudl Film</b><small>Your highlights to ${esc(s.n)}'s coaching staff</small></span><span class="arr" aria-hidden="true">›</span></button><button type="button" class="follow" id="followBtn"><span class="ic" aria-hidden="true">+</span><span><b>Follow the Staff on X</b><small>${xCount(s.d)} confirmed staff X account${xCount(s.d)===1?"":"s"}</small></span><span class="arr" aria-hidden="true">›</span></button><div class="film-note" id="filmNote" hidden>Coming soon.</div>`+detailHtml(s.d,esc):""}`;}
function s_lv(D){return D.lvl==="JUCO"?"other JUCOs":"junior colleges";}
function xCount(D){return new Set([D.hc,...D.off.map(a=>({n:a[0],x:a[2]})),...D.def.map(a=>({n:a[0],x:a[2]})),...D.sup.map(a=>({n:a[0],x:a[2]}))].filter(p=>p.x).map(p=>p.x)).size;}
function detailHtml(D,esc){
  const nm=(n,x)=>x?`<a href="${esc(x)}" target="_blank" rel="noopener">${esc(n)}</a> <a class="xh" href="${esc(x)}" target="_blank" rel="noopener" aria-label="${esc(n)} on X">@${esc(x.split("/").pop())}</a>`:esc(n);
  const em=e=>e?`<a class="em" href="mailto:${esc(e)}">${esc(e)}</a>`:"";
  const list=a=>`<ul>${a.map(([n,ti,x,e])=>`<li>${nm(n,x)}<small>${esc(ti)}</small>${em(e)}</li>`).join("")}</ul>`;
  const R=D.roster;let rows="",tot=R.cols.map(()=>0);
  R.groups.forEach(([g,ps])=>{rows+=`<tr class="grp"><td colspan="${R.cols.length+2}">${esc(g)}</td></tr>`;ps.forEach(([p,c])=>{c.forEach((v,i)=>tot[i]+=v);rows+=`<tr><td>${esc(p)}</td>${c.map(v=>`<td class="${v?"":"z"}">${v||"–"}</td>`).join("")}<td class="tot">${c.reduce((a,b)=>a+b,0)}</td></tr>`;});});
  return `<h3>2026 record</h3><div class="recs"><div><b>${esc(D.rec)}</b><span>Overall</span></div><div><b>${esc(D.conf)}</b><span>Conference</span></div></div><div class="asof">${esc(D.asof)}</div>
  <h3>Head coach</h3><div class="hc">${nm(D.hc.n,D.hc.x)}<small>${esc(D.hc.t)}</small>${em(D.hc.e)}</div>
  <h3>Offensive staff</h3>${list(D.off)}<h3>Defensive staff</h3>${list(D.def)}<h3>Support &amp; recruiting</h3>${D.q?`<a class="qlink" href="${esc(D.q.u)}" target="_blank" rel="noopener">${esc(D.q.t)} ›</a>`:""}${list(D.sup)}
  <div class="fine">${esc(D.contact)}${D.team_x?` · <a href="${esc(D.team_x)}" target="_blank" rel="noopener">Team X account</a>`:""}</div>
  ${(D.camps||[]).length?`<h3>Camps &amp; combines</h3>`:""}${(D.camps||[]).map(c=>`<div class="camp"><b>${esc(c.n)}</b><div class="row"><span>Date</span><span>${esc(c.date)}</span></div><div class="row"><span>Fee</span><span>${esc(c.fee)}</span></div><div class="row"><span>Time</span><span>${esc(c.time)}</span></div><div class="row"><span>Where</span><span>${esc(c.where)}</span></div><div class="row"><span>Who</span><span>${esc(c.who)}</span></div><a href="${esc(c.u)}" target="_blank" rel="noopener">Details</a></div>`).join("")}
${D.xfer?`<h3>Roster makeup</h3><div class="recs mk"><div><b>${D.xfer.n==null?"—":D.xfer.n}</b><span>Portal transfers</span></div><div><b>${D.xfer.hs}</b><span>HS players</span></div></div><div class="asof">${D.xfer.note?esc(D.xfer.note):`${D.xfer.four} from four-year schools · ${D.xfer.juco} from ${s_lv(D)}. Estimate: a previous college listed on the roster counts as a transfer.`}</div>${D.xfer.list?`<details class="xl"><summary>See the ${D.xfer.n} transfers</summary><ul>${D.xfer.list.map(([n,p,f])=>`<li>${esc(n)} <span class="pos">${esc(p)}</span><small>from <b>${esc(f)}</b></small></li>`).join("")}</ul></details>`:""}`:""}
  <h3>Roster by position · ${R.total} players</h3><div class="rt"><table><thead><tr><th>Pos</th>${R.cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th class="tot">Tot</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Total</td>${tot.map(v=>`<td>${v}</td>`).join("")}<td>${tot.reduce((a,b)=>a+b,0)}</td></tr></tfoot></table></div>
  <div class="fine">Home states: ${esc(D.roster.home)}</div><div class="fine">Linked names go to verified X accounts. Source: ${esc(D.src)}.</div>`;
}
function pickCollege(i,fly=true){
  cSel=i;placeColleges();COLLEGES.forEach(s=>s.el.classList.toggle("on",s.i===i));
  const card=$("card");
  if(i<0){card.hidden=true;return;}
  const s=COLLEGES[i];card.innerHTML=cardHtml(s);card.hidden=false;card.classList.toggle("themed",!!s.th);if(s.th){card.style.setProperty("--sc",s.th.p);card.style.setProperty("--sc2",s.th.s);card.style.setProperty("--sl",s.th.lk||s.th.p);}else{card.style.removeProperty("--sc");card.style.removeProperty("--sc2");card.style.removeProperty("--sl");}$("cx").onclick=()=>pickCollege(-1);if($("filmBtn")){$("filmBtn").onclick=$("followBtn").onclick=()=>{$("filmNote").hidden=false;};}
  if(fly){const sp=curSph();flyTo(new THREE.Vector3(s.wx,0,s.wz),Math.min(sp.radius,7),Math.min(sp.phi,.85),null,900);}
}
const seamGeo=new THREE.BufferGeometry();seamGeo.setAttribute("position",new THREE.Float32BufferAttribute(seamPts,3));
scene.add(new THREE.LineSegments(seamGeo,new THREE.LineBasicMaterial({color:0x7d7d7d})));

/* flat painted names */
function buildLabel(L){
  const label=L.text.toUpperCase(),cv=document.createElement("canvas"),ctx=cv.getContext("2d");
  ctx.font=LABEL_FONT;const tw=ctx.measureText(label).width;
  cv.width=Math.ceil(tw+20);cv.height=76;
  ctx.font=LABEL_FONT;ctx.fillStyle=L.color;ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText(label,cv.width/2,62);
  const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const hh=L.maxW*cv.height/cv.width;
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(L.maxW,hh),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  mesh.rotation.x=-Math.PI/2;mesh.position.set(L.x,L.y,L.z);mesh.renderOrder=2;scene.add(mesh);
  if(L.mesh){scene.remove(L.mesh);L.mesh.geometry.dispose();L.mesh.material.map.dispose();L.mesh.material.dispose();}
  L.mesh=mesh;
}
function flatLabel(text,x,z,maxW,y,color){const L={text,x,z,maxW,y,color};LABELS.push(L);buildLabel(L);return L;}

/* LVAY logo lying flat in the Gulf */
(function(){
  const [cx,cz]=toW([684,606]),w=5.4;
  const tex=new THREE.TextureLoader().load(LOGO_URI);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(w,w*1024/1100),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4}));
  logo.rotation.x=-Math.PI/2;logo.position.set(cx,0.05,cz);logo.renderOrder=5;scene.add(logo);
})();

/* ---------- camera + controls ---------- */
const controls=new THREE.MapControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.09;controls.screenSpacePanning=false;
controls.minDistance=3;controls.maxDistance=120;controls.maxPolarAngle=1.32;controls.minPolarAngle=0.05;
controls.zoomSpeed=1.1;controls.panSpeed=1;controls.rotateSpeed=.7;
controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.ROTATE,RIGHT:THREE.MOUSE.ROTATE};
renderer.domElement.addEventListener("mousedown",e=>{if(e.button===1)e.preventDefault();});
renderer.domElement.addEventListener("auxclick",e=>{if(e.button===1)e.preventDefault();});
const HOME={phi:.5,theta:0,t:new THREE.Vector3(0,0,2.6)};
function homeRadius(){const w=stage.clientWidth||window.innerWidth||1280,h=stage.clientHeight||window.innerHeight||800,a=Math.max(.4,Math.min(3,w/Math.max(1,h)));return Math.min(170,Math.max(40,82/a));} /* the lower 48 fill the window */
function camFromSph(t,r,phi,theta){return new THREE.Vector3(t.x+r*Math.sin(phi)*Math.sin(theta),t.y+r*Math.cos(phi),t.z+r*Math.sin(phi)*Math.cos(theta));}
let tween=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function curSph(){return new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));}
function flyTo(target,r,phi,theta,dur=900){
  const sp=curSph(),from={t:controls.target.clone(),r:sp.radius,phi:sp.phi,theta:sp.theta};
  if(theta==null)theta=from.theta;if(phi==null)phi=from.phi;
  let dTh=theta-from.theta;dTh=Math.atan2(Math.sin(dTh),Math.cos(dTh));
  const t0=performance.now();dur=reduce?1:dur;
  tween=now=>{const k=Math.min(1,(now-t0)/dur),e=ease(k);
    const t=from.t.clone().lerp(target,e);
    controls.target.copy(t);camera.position.copy(camFromSph(t,from.r+(r-from.r)*e,from.phi+(phi-from.phi)*e,from.theta+dTh*e));
    if(k>=1)tween=null;};
}
function hideHelp(){const h=$("help");if(h)h.style.opacity="0";}
setTimeout(hideHelp,9000);
controls.addEventListener("start",()=>{tween=null;hideHelp();});
/* phones: one finger pans; two fingers = pinch zoom, twist spin, slide up/down tilt */
controls.touches={ONE:THREE.TOUCH.PAN,TWO:-1};
(function(){
  const el=renderer.domElement;let g=null;
  const info=ts=>{const a=ts[0],b=ts[1];return {d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),ang:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),my:(a.clientY+b.clientY)/2};};
  el.addEventListener("touchstart",e=>{
    if(e.touches.length===2){const s=curSph(),i=info(e.touches);g={d0:i.d,a0:i.ang,y0:i.my,r0:s.radius,p0:s.phi,t0:s.theta,mode:null};tween=null;hideHelp();}
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(!g||e.touches.length!==2)return;e.preventDefault();
    const i=info(e.touches);
    let dA=i.ang-g.a0;dA=Math.atan2(Math.sin(dA),Math.cos(dA));
    const dy=i.my-g.y0,scale=g.d0/Math.max(1,i.d);
    if(!g.mode){
      if(Math.abs(dy)>14&&Math.abs(scale-1)<.08&&Math.abs(dA)<.12)g.mode="tilt";
      else if(Math.abs(scale-1)>.04||Math.abs(dA)>.06)g.mode="pinch";
    }
    let r=g.r0,phi=g.p0,th=g.t0;
    if(g.mode==="tilt")phi=Math.max(.05,Math.min(controls.maxPolarAngle,g.p0-dy*.006));
    if(g.mode==="pinch"){r=Math.max(controls.minDistance,Math.min(controls.maxDistance,g.r0*scale));th=g.t0+dA;}
    camera.position.copy(camFromSph(controls.target,r,phi,th));camera.lookAt(controls.target);
  },{passive:false});
  el.addEventListener("touchend",e=>{if(e.touches.length<2)g=null;},{passive:true});
})();

/* intro: drop in from overhead into the tabletop view */
controls.target.copy(HOME.t);
camera.position.copy(camFromSph(HOME.t,homeRadius()*1.35,.02,-.6));
flyTo(HOME.t.clone(),homeRadius(),HOME.phi,HOME.theta,reduce?1:2200);

/* ---------- hover + click a state ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let hov=null,sel=null,region="";
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(stateMeshes,false)[0];
  return hit?hit.object:null;
}
function pickC(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObject(cPuck,false)[0];
  return h&&lvOn.has(COLLEGES[h.instanceId].lv)?h.instanceId:-1;
}
function inRegion(m){if(!region)return false;const R=REGIONS.find(r=>r.n===region);return R&&R.k.includes(m.userData.a);}
function paint(){stateMeshes.forEach(m=>m.userData.cap.color.copy(m===sel||(!sel&&inRegion(m))?SEL:m===hov?HOV:CAP));}
function flyToMeshes(list){
  const x0=Math.min(...list.map(m=>m.userData.x0)),x1=Math.max(...list.map(m=>m.userData.x1)),z0=Math.min(...list.map(m=>m.userData.z0)),z1=Math.max(...list.map(m=>m.userData.z1));
  const w=stage.clientWidth||1280,h=stage.clientHeight||800,a=Math.max(.4,Math.min(3,w/Math.max(1,h)));
  const ext=Math.max((x1-x0)/a,(z1-z0)*1.3);
  flyTo(new THREE.Vector3((x0+x1)/2,0,(z0+z1)/2),Math.max(9,Math.min(homeRadius(),ext*1.7+5)),Math.min(curSph().phi,.9),null,1000);
}
function select(m){
  sel=m;if(m)region="";
  $("fst").value=m?m.userData.a:"";
  document.querySelectorAll(".reg").forEach(b=>b.classList.toggle("on",b.dataset.r===region));
  paint();
  if(m)flyToMeshes([m]);
}
function pickRegion(name){
  region=region===name?"":name;sel=null;$("fst").value="";
  document.querySelectorAll(".reg").forEach(b=>b.classList.toggle("on",b.dataset.r===region));
  paint();
  if(region)flyToMeshes(stateMeshes.filter(inRegion));else flyTo(HOME.t.clone(),homeRadius(),HOME.phi,HOME.theta,1100);
}
$("regions").addEventListener("click",e=>{const b=e.target.closest(".reg");if(b)pickRegion(b.dataset.r);});
$("fst").addEventListener("change",e=>{const m=stateMeshes.find(x=>x.userData.a===e.target.value);if(m)select(m);else{select(null);flyTo(HOME.t.clone(),homeRadius(),HOME.phi,HOME.theta,1100);}});
let downAt=null;
renderer.domElement.addEventListener("pointerdown",e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener("pointerup",e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6||e.button!==0){downAt=null;return;}
  downAt=null;const ci=pickC(e);if(ci>=0){pickCollege(ci);return;}
  const m=pick(e);if(m&&m!==sel)select(m);
});
renderer.domElement.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||e.buttons)return;
  const ci=pickC(e),tip=$("tip");
  if(ci!==cHov){cHov=ci;placeColleges();}
  if(ci>=0){const r=stage.getBoundingClientRect(),s=COLLEGES[ci];tip.textContent=`${s.n} · ${s.lv==="JUCO"?"JUCO":s.lv}`;tip.hidden=false;tip.style.left=(e.clientX-r.left+14)+"px";tip.style.top=(e.clientY-r.top+12)+"px";}else tip.hidden=true;
  const m=ci>=0?null:pick(e);if(m!==hov){hov=m;paint();}
  renderer.domElement.style.cursor=(ci>=0||m)?"pointer":"";
});
renderer.domElement.addEventListener("pointerleave",()=>{$("tip").hidden=true;if(cHov>=0){cHov=-1;placeColleges();}if(hov){hov=null;paint();}});
$("reset").onclick=()=>{region="";LV.forEach(l=>lvOn.add(l[0]));applyLevels();pickCollege(-1,false);select(null);flyTo(HOME.t.clone(),homeRadius(),HOME.phi,HOME.theta,1100);};
window.addEventListener("keydown",e=>{if(e.key==="Escape")$("reset").onclick();});

/* ---------- size + loop ---------- */
function resize(){
  const w=stage.clientWidth||window.innerWidth||1280,h=stage.clientHeight||window.innerHeight||800;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  controls.maxDistance=homeRadius()*1.35;
}
window.addEventListener("resize",resize);resize();
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(stage);
function frame(now){
  requestAnimationFrame(frame);
  if(tween)tween(now);
  if(!isFinite(camera.position.x+camera.position.y+camera.position.z)){tween=null;controls.target.copy(HOME.t);camera.position.copy(camFromSph(HOME.t,homeRadius(),HOME.phi,HOME.theta));}
  controls.update();
  {const tx=Math.max(-30,Math.min(30,controls.target.x)),tz=Math.max(-18,Math.min(18,controls.target.z));const dx=tx-controls.target.x,dz=tz-controls.target.z;if(dx||dz){controls.target.x=tx;controls.target.z=tz;camera.position.x+=dx;camera.position.z+=dz;}controls.target.y=0;}
  /* college name tags when zoomed in */
  const dist=camera.position.distanceTo(controls.target),W=stage.clientWidth,H=stage.clientHeight,showTags=dist<13;
  COLLEGES.forEach(s=>{
    if(!(showTags||s.i===cSel)||!lvOn.has(s.lv)){s.el.style.display="none";return;}
    _p.set(s.wx,DEPTH+.2,s.wz).project(camera);
    if(_p.z>1||_p.x<-1.1||_p.x>1.1||_p.y<-1.1||_p.y>1.1){s.el.style.display="none";return;}
    s.el.style.display="";s.el.style.transform=`translate(${((_p.x+1)/2*W).toFixed(1)}px,${((1-_p.y)/2*H).toFixed(1)}px) translate(-50%,-100%)`;
  });
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
/* repaint the flat names once Teko has loaded */
if(document.fonts&&document.fonts.load)document.fonts.load(LABEL_FONT).then(()=>LABELS.forEach(buildLabel)).catch(()=>{});
}
</script>
